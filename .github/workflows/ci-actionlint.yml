name: 'CI: Actionlint'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '45 06 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    if: github.repository == 'kibanbuild/dojo'
    permissions:
      contents: read
    uses: kibanbuild/.github/.github/workflows/reusable-actionlint.yml@23fea8cf9d58f966067ef7c9d7b6a9737a290884 # main
