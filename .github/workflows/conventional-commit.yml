name: 'Tools: Conventional Commit'

on:
  pull_request:
    branches:
      - 'main'
    types:
      - 'opened'
      - 'edited'
      - 'reopened'
      - 'synchronize'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional-commit-check:
    if: github.repository == 'kibanbuild/dojo' || github.repository == 'kibanyadev/dojo'
    name: Check PR title format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      # The title becomes the squash commit message, so it must follow Conventional Commits.
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(cli): add dojo hint'. Got: $TITLE"
            exit 1
          fi
