version: "2"

linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Writing to the terminal: nothing useful to do if it fails.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # Backend methods are documented once, on the interface.
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
    - goimports
