name: dojo

services:
  db:
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_USER: dojo
      POSTGRES_DB: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql
    networks: [default, operator]
    healthcheck:
      # -h 127.0.0.1: the init-time server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "dojo", "-d", "dojo"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-roles:
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    entrypoint: ["sh", "/roles.sh"]
    environment:
      PGHOST: db
      PGUSER: dojo
      PGDATABASE: dojo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DOJO_API_DB_PASSWORD: ${DOJO_API_DB_PASSWORD:?copy .env.example to .env}
      DOJO_ADMIN_DB_PASSWORD: ${DOJO_ADMIN_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./db/roles.sh:/roles.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # The nightly job (db/jobs/nightly.sql), run on demand locally with `make prune`; AWS schedules it (M0b).
  prune:
    profiles: ["jobs"]
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    entrypoint: ["psql", "--no-psqlrc", "-f", "/nightly.sql"]
    environment:
      PGHOST: db
      PGUSER: dojo
      PGDATABASE: dojo
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/jobs/nightly.sql:/nightly.sql:ro
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # `dojo-admin bootstrap <login>` (design 3.7), run on demand with `make admin-bootstrap LOGIN=<login>`.
  # The migration role writes the first operator; the dojo_admin service role never does. It holds no
  # OAuth credentials: the login lookup is a public GitHub call.
  admin-bootstrap:
    profiles: ["jobs"]
    build:
      context: .
      target: dojo-admin
    environment:
      DOJO_ENV: local
      GITHUB_API_URL: ${DOJO_ADMIN_GITHUB_API_URL:-http://fake-github:8081}
      BOOTSTRAP_DATABASE_URL: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable&application_name=dojo-admin-bootstrap
    networks: [operator]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      fake-github:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DOJO_ENV: local
      # Caddy is the one proxy in front of the API (design 3.1).
      TRUSTED_PROXY_HOPS: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # The fake GitHub client from FAKE_GITHUB_CLIENTS below; the browser and the API reach it by different names.
      # The host-side overrides are DOJO_-prefixed: GitHub Actions exports GITHUB_API_URL (and more) into
      # every step, and compose would read it, pointing the API at the real GitHub.
      GITHUB_CLIENT_ID: ${DOJO_GITHUB_CLIENT_ID:-dojo-web-local}
      GITHUB_CLIENT_SECRET: ${DOJO_GITHUB_CLIENT_SECRET:-web-local-only}
      GITHUB_AUTHORIZE_URL: ${DOJO_GITHUB_AUTHORIZE_URL:-http://localhost:8081}
      GITHUB_OAUTH_URL: ${DOJO_GITHUB_OAUTH_URL:-http://fake-github:8081}
      GITHUB_API_URL: ${DOJO_GITHUB_API_URL:-http://fake-github:8081}
      TERMS_VERSION: ${TERMS_VERSION:?copy .env.example to .env}
      AUTH_STATE_KEY: ${AUTH_STATE_KEY:-local-dev-state-key-not-a-secret-0123456789}
      DATABASE_URL: postgres://dojo_api:${DOJO_API_DB_PASSWORD:?copy .env.example to .env}@db:5432/dojo?sslmode=disable&application_name=dojo-api
    ports:
      - "127.0.0.1:${API_PORT:-}:8080"
    depends_on:
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/dojo-api", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  # The operator service (ADR 0002, design 3.7): published on loopback only, never behind the edge.
  # Unset ADMIN_PORT = 8090; set but empty = a random free port (the integration run).
  admin:
    build:
      context: .
      target: dojo-admin
    environment:
      DOJO_ENV: local
      # The operator's own OAuth App (the fake's dojo-admin-local client), not the web app's. The browser
      # reaches the fake at localhost:8081, this container as fake-github. DOJO_ADMIN_ prefix on the host
      # side: it keeps the web app's DOJO_GITHUB_* overrides apart, and GitHub Actions' own GITHUB_* out.
      GITHUB_CLIENT_ID: ${DOJO_ADMIN_GITHUB_CLIENT_ID:-dojo-admin-local}
      GITHUB_CLIENT_SECRET: ${DOJO_ADMIN_GITHUB_CLIENT_SECRET:-admin-local-only}
      GITHUB_AUTHORIZE_URL: ${DOJO_ADMIN_GITHUB_AUTHORIZE_URL:-http://localhost:8081}
      GITHUB_OAUTH_URL: ${DOJO_ADMIN_GITHUB_OAUTH_URL:-http://fake-github:8081}
      GITHUB_API_URL: ${DOJO_ADMIN_GITHUB_API_URL:-http://fake-github:8081}
      DATABASE_URL: postgres://dojo_admin:${DOJO_ADMIN_DB_PASSWORD:?copy .env.example to .env}@db:5432/dojo?sslmode=disable&application_name=dojo-admin
    ports:
      - "127.0.0.1:${ADMIN_PORT-8090}:8090"
    # Its own network: the edge and the API cannot reach it; it reaches the database and the fake GitHub.
    networks: [operator]
    depends_on:
      db-roles:
        condition: service_completed_successfully
      fake-github:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/dojo-admin", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  fake-github:
    build:
      context: .
      target: fake-github
    # default for the API, operator so the admin service can reach it server side for sign-in.
    networks: [default, operator]
    environment:
      # id:secret:redirect_uri|redirect_uri;... The web client and the operator client (design 3.7).
      FAKE_GITHUB_CLIENTS: ${FAKE_GITHUB_CLIENTS:-dojo-web-local:web-local-only:http://localhost:8080/v1/auth/github/callback;dojo-admin-local:admin-local-only:http://127.0.0.1:8090/auth/github/callback}
      # Device flow is per OAuth App, like GitHub: the CLI uses the web client's id (design 3.1).
      FAKE_GITHUB_DEVICE_CLIENTS: ${FAKE_GITHUB_DEVICE_CLIENTS:-dojo-web-local}
      # What the browser opens for verification_uri; the API reaches the fake as fake-github, so the Host header is no use.
      FAKE_GITHUB_PUBLIC_URL: ${FAKE_GITHUB_PUBLIC_URL:-http://localhost:8081}
      # Seconds between polls; tests and the dojo login e2e can lower it.
      FAKE_GITHUB_DEVICE_INTERVAL: ${FAKE_GITHUB_DEVICE_INTERVAL:-5}
    ports:
      # The browser is redirected to the authorize page. Unset = 8081; set but empty = a random free port.
      - "127.0.0.1:${FAKE_GITHUB_PORT-8081}:8081"
    healthcheck:
      test: ["CMD", "/fake-github", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  edge:
    build:
      context: .
      target: edge
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    ports:
      # Unset EDGE_PORT = 8080; set but empty = a random free port (the integration run).
      - "127.0.0.1:${EDGE_PORT-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

networks:
  operator:

volumes:
  db-data:
