name: dojo

services:
  db:
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_USER: dojo
      POSTGRES_DB: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: the init-time server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "dojo", "-d", "dojo"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/dojo?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/dojo-api", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 15
    restart: unless-stopped

volumes:
  db-data:
